## phonon_inputs config: 2H-MoS2 bulk -- HIPHIVE STATICS STAGE.
## The structure section is REWRITTEN by phonon/studies/_run_mos2_fc.py
## with the relaxed cell from mos2_relax_vasp.yaml before sow/run/reap
## (the generated copy lives next to the hiphive work_dir).
##
## Supercell [4,4,1] = 96 atoms (12.64 x 12.64 x 12.29 A): the
## primitive cell already spans two layers along c, so interlayer
## FC2/FC3 (S-S contacts ~3.5 A) are captured within the cell and to
## the c-neighbour image. Cutoffs < min(L)/2 = 6.15 A.
##   FC2 6.0 A: intralayer up to 3rd shell + all interlayer S-S/Mo-S
##   FC3 4.0 A: intralayer + interlayer S-S triplets (the cross-plane
##              anharmonic channel)
## D3 (IVDW=11) on every static: interlayer anharmonicity comes almost
## entirely from the dispersion tail.

fc_method: hiphive

structure:
  source: inline
  symbols: [Mo, Mo, S, S, S, S]
  lattice:
    - [3.1600, 0.0000, 0.0000]
    - [-1.5800, 2.7366402760, 0.0000]
    - [0.0000, 0.0000, 12.2940]
  scaled_positions:                # placeholder -- driver injects relaxed
    - [0.333333333333, 0.666666666667, 0.250000]
    - [0.666666666667, 0.333333333333, 0.750000]
    - [0.666666666667, 0.333333333333, 0.121000]
    - [0.666666666667, 0.333333333333, 0.379000]
    - [0.333333333333, 0.666666666667, 0.621000]
    - [0.333333333333, 0.666666666667, 0.879000]

vasp:
  potcar_dir: /home/jiacao/vasp/potpaw_PBE
  potcar_map:
    Mo: Mo_sv
    S: S
  encut: 400
  ediff: 1.0e-6
  ismear: 0
  sigma: 0.05
  prec: Accurate
  lreal: Auto                      # 96-atom supercell: real-space projectors
  lwave: false
  lcharg: false
  ncore: 8
  kpar: 2
  kpoints_scf: [3, 3, 2]           # [4,4,1] supercell ~ primitive 12x12x2
  incar_extra: {IVDW: 11}
  vasp_command: "export LD_LIBRARY_PATH=/usr/scratch/mont-fort11/pfischill/vasprt-venv/lib:/home/jiacao/openmpi/4.1.1-ifort/lib; ulimit -s unlimited; export OMP_STACKSIZE=512m; export OMP_NUM_THREADS=1; /home/jiacao/openmpi/4.1.1-ifort/bin/mpirun -np 128 --bind-to core --map-by socket:PE=1 /home/jiacao/Software/vasp.6.3.0/bin/vasp_std"

relax:
  calculation: relax               # not used (driver runs relax stage config)
  forc_conv_thr: 0.001
  calculator: vasp
  work_dir: ./relax_mos2_vasp

hiphive:
  supercell: [4, 4, 1]             # 96 atoms
  n_structures: 40
  rattle_method: mc
  rattle_std: 0.03                 # Angstrom
  rattle_d_min: 2.0                # min pair separation (Mo-S bond 2.41 A)
  rattle_n_iter: 2
  rattle_seed: 42
  cutoffs: [6.0, 4.0]              # [FC2, FC3] A; < L/2 = 6.15 A
  fit_method: ardr
  fit_kwargs: {}
  rotational_sum_rule: post_fit
  calculator: vasp
  work_dir: ./fc3_hiphive_mos2_vasp
  pw_timeout: 7200                 # 96-atom semiconducting statics
