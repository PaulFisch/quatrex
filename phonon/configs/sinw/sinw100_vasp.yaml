## phonon_inputs configuration: H-passivated <100> Si nanowire — VASP
## Smallest practical <100> SiNW: 9 Si core atoms + 44 H surface atoms (53 total).
## Wire axis along z, period c = a_Si = 5.43 A; ~12 A vacuum gap in x and y.
## Bulk Si lattice constant a = 5.43 A (PBE equilibrium).
## Geometry built by carving an R_core = 3.5 A column out of bulk Si and
## capping every undercoordinated surface Si along its missing sp3 directions
## with H at d(Si-H) = 1.48 A.
##
## Designed as a small but physically reasonable testcase:
##   - 53-atom unit cell, 1x1x2 supercell (106 atoms) for FC3
##   - H-passivation gapped + small sigma keeps SCF cheap (no metallic surface states)
##   - relax (ISIF=2) keeps the cell fixed; vc-relax would collapse the vacuum
##   - LREAL=Auto on the supercell -> fast forces (vacuum-rich cell)
##
## Usage:
##   python -m phonon_inputs pipeline  --config config_sinw100_vasp.yaml
##   python -m phonon_inputs pipeline  --config config_sinw100_vasp.yaml --skip-relax
##   python -m phonon_inputs fc3-sow   --config config_sinw100_vasp.yaml
##   python -m phonon_inputs fc3-run   --config config_sinw100_vasp.yaml
##   python -m phonon_inputs fc3-reap  --config config_sinw100_vasp.yaml

