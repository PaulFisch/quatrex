  prec: Accurate
  lreal: Auto
  lwave: false
  lcharg: false
  ncore: 8
  kpar: 4
  kpoints_scf: [1, 1, 4]
  vasp_command: "ulimit -s unlimited; export OMP_STACKSIZE=512m; export OMP_NUM_THREADS=1; mpirun -np 128 --bind-to core --map-by socket:PE=1 /usr/scratch/tortin8/pfischill/vasp.6.3.2/bin/vasp_std"
fc_method: hiphive
relax:
  calculation: relax
  forc_conv_thr: 0.005
  calculator: vasp
  work_dir: ./relax_sinw100_d12a_vasp
hiphive:
  # ----------------------------------------------------------------------
  # SiNW(100), d ~ 12 Å (~29 Si + ~22 H per primitive, ~102 atoms in [1,1,2]).
  # Settings rationale: see phonon/phonon_inputs/HIPHIVE_FITTING_NOTES.md
  # ----------------------------------------------------------------------
  supercell: [1, 1, 2]
  # 32 × ~102 × 3 ≈ 9800 equations vs ~5000 FC3 parameters; close to 2×.
  # If the convergence sweep shows rmse_test still falling at size=32,
  # bump pool_size to 48 and re-sow.
  n_structures: 32
  rattle_method: mc
  rattle_std: 0.04
  rattle_d_min: 1.4
  rattle_n_iter: 20
  rattle_seed: 42
  cutoffs: [5.0, 4.0]
  fit_method: ardr
  fit_kwargs: {}
  rotational_sum_rule: post_fit
  convergence:
    sizes: [12, 18, 24, 32]
    pool_size: 32
    test_fraction: 0.2
    seed: 0
    fit_methods: [ardr, rfe]
    dispersion_q_mesh: [1, 1, 16]
  phonon_rattle_temperature_k: 300.0
  phonon_rattle_bootstrap_n: 8
  phonon_rattle_bootstrap_seed: 0
  phonon_rattle_imag_freq_factor: 0.0
  phonon_rattle_qm: true
  calculator: vasp
  work_dir: ./fc3_hiphive_sinw100_d12a_vasp
  pw_timeout: 7200
thirdorder:
  supercell: [1, 1, 2]
  cutoff_pair_distance: null
  displacement_distance: 0.03
  fc_calculator: symfc
