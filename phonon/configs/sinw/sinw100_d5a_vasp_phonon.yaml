  vasp_command: "ulimit -s unlimited; export OMP_STACKSIZE=512m; export OMP_NUM_THREADS=1; mpirun -np 128 --bind-to core --map-by socket:PE=1 /usr/scratch/tortin8/pfischill/vasp.6.3.2/bin/vasp_std"
fc_method: hiphive
relax:
  calculation: relax
  forc_conv_thr: 0.005
  calculator: vasp
  work_dir: ./relax_sinw100_d5a_vasp
hiphive:
  # ----------------------------------------------------------------------
  # SiNW(100), d ~ 5 Å (9 Si + 12 H per primitive, 42 atoms in [1,1,2]).
  # Settings rationale: see phonon/phonon_inputs/HIPHIVE_FITTING_NOTES.md
  # ----------------------------------------------------------------------
  supercell: [1, 1, 2]
  # 32 = master pool for the convergence sweep (subsampled at 12/18/24/32);
  # 32 × 42 × 3 = 4032 equations vs ~1000 cluster parameters — comfortable
  # 4× overdetermination for the FC3 fit at cutoffs [5, 4] Å.
  n_structures: 32
  # Phonon-rattle workflow (FC2-bootstrap). `fc3-hiphive-sow` writes a
  # small mc-rattle bootstrap pool into ./<work_dir>/bootstrap/ on its
  # first invocation; after DFT and `fc3-hiphive-bootstrap-reap` produce
  # fc2_seed.npy, a second `fc3-hiphive-sow` emits the phonon-rattled
  # main pool at phonon_rattle_temperature_k. See README in this dir.
  rattle_method: phonon
  rattle_std: 0.04
  rattle_d_min: 1.4
  rattle_n_iter: 20
  rattle_seed: 42
  cutoffs: [5.0, 4.0]
  # ardr (Automatic Relevance Determination Regression) is the
  # hiphive-recommended default for under-/marginally-determined FC3:
  # parameter-free, selects sparsity automatically, more stable than rfe.
  fit_method: ardr
  fit_kwargs: {}
  # Rotational sum rules (Huang + Born–Huang) projected post-fit. This is
  # the critical knob for nanowires — without it the ZA flexural branch
  # develops a spurious low-frequency gap at Γ and the FC3 ASR-leg
  # residual stays ~80 % (cf. previous fc3.hdf5).
  rotational_sum_rule: post_fit
  # Convergence sweep: refit at {12, 18, 24, 32} with two methods; pick the
  # smallest n_structures where rmse_test and dispersion_max_thz saturate.
  convergence:
    sizes: [12, 18, 24, 32]
    pool_size: 32
    test_fraction: 0.2
    seed: 0
    fit_methods: [ardr, rfe]
    dispersion_q_mesh: [1, 1, 16]
  # Phonon-rattle settings (used by sinw100_d5a_vasp_phonon.yaml). Kept
  # here as defaults so a switch to rattle_method: phonon in a derived
  # config inherits sensible numbers.
  phonon_rattle_temperature_k: 300.0
  phonon_rattle_bootstrap_n: 6
  phonon_rattle_bootstrap_seed: 0
  phonon_rattle_imag_freq_factor: 1.0
  phonon_rattle_qm: true
  calculator: vasp
  work_dir: ./fc3_hiphive_sinw100_d5a_vasp_phonon
  pw_timeout: 7200
thirdorder:
  supercell: [1, 1, 2]
  cutoff_pair_distance: null
  displacement_distance: 0.03
  fc_calculator: symfc
