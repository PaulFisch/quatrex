vasp:
  potcar_dir: /home/jiacao/vasp/potpaw_PBE
  potcar_map:
    Si: Si                        # uses potpaw_PBE/Si/POTCAR
    H: H                          # uses potpaw_PBE/H/POTCAR
  encut: 400                      # eV - covers H ENMAX (250) and Si ENMAX (245) comfortably
  ediff: 1.0e-7                   # eV
  ismear: 0                       # Gaussian smearing (semiconductor: H-passivated SiNW is gapped)
  sigma: 0.01                     # eV - narrow smearing fine for gapped wire
  prec: Accurate
  lreal: Auto                     # real-space projectors -> faster on the 106-atom supercell
  lwave: false
  lcharg: false
  ncore: 8                        # cores per band group (one EPYC NUMA domain)
  kpar: 4                         # one k-point per group; clean 128 = 4*32 split
  kpoints_scf: [1, 1, 2]          # 1x1x4 supercell -> 2 z-kpts ~ 8 in primitive units
  vasp_command: "ulimit -s unlimited; export OMP_STACKSIZE=512m; export OMP_NUM_THREADS=1; mpirun -np 128 --bind-to core --map-by socket:PE=1 /usr/scratch/tortin8/pfischill/vasp.6.3.2/bin/vasp_std"

relax:
  calculation: relax              # ISIF=2: atoms only -> keeps wire length & vacuum fixed
  forc_conv_thr: 0.005            # eV/A - relaxes Si-H bonds and surface reconstruction
  calculator: vasp
  work_dir: ./relax_sinw100_sc4_vasp
  fc_method: hiphive
hiphive:
  supercell: [1, 1, 4]            # 212-atom rattled supercells (1x1x4)
  n_structures: 12                # bumped from 6: 212-atom supercells need more samples
  rattle_method: mc               # Monte-Carlo rattling (respects d_min)
  rattle_std: 0.03
  rattle_d_min: 1.3               # < Si-H 1.48 A so the rattler accepts moves
  rattle_n_iter: 10
  rattle_seed: 42
  cutoffs: [5.0, 4.0]             # FC2 to 5.0 A, FC3 to 4.0 A (covers Si-Si NN + Si-H)
  fit_method: least-squares
  fit_kwargs: {}
  calculator: vasp
  work_dir: ./fc3_hiphive_sinw100_sc4_vasp
  pw_timeout: 7200

thirdorder:
  supercell: [1, 1, 4]            # 212 atoms - bigger, captures up to ~10.9 A along wire
  cutoff_pair_distance: null
  displacement_distance: 0.03     # Angstrom - slightly larger; phono3py prefers > 0.02 here
  fc_calculator: symfc            # symmetry-adapted fitting
  calculator: vasp
  work_dir: ./fc3_sinw100_sc4_vasp
  pw_timeout: 7200                # 2 hours per displacement (106 atoms, but vacuum-rich)
