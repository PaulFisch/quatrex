## phonon_inputs configuration: H-passivated <100> Si nanowire — VASP
## Larger-supercell variant of sinw100_vasp.yaml: same 53-atom unit cell,
## but 1x1x4 (212 atoms) supercell instead of 1x1x2 (106 atoms).
##
## Same geometry as sinw100_vasp.yaml: 9 Si core + 44 H surface atoms,
## wire axis along z, period c = a_Si = 5.43 A, ~12 A vacuum in x and y.
## Geometry built by carving R_core = 3.5 A column out of bulk Si and
## capping with H at d(Si-H) = 1.48 A.
##
## Designed for tighter FC3 capture along the wire:
##   - 53-atom unit cell, 1x1x4 supercell (212 atoms) for FC3
##   - Captures FC2 / FC3 out to ~ 10.9 A along z (vs ~ 5.4 A for 1x1x2)
##   - Cost: ~4x SCF wall time per displacement, plus more displacements
##     for hiphive (n_structures bumped to 12, see below)
##   - Use this when sinw100_vasp.yaml shows an under-converged FC3 tail
##     in the 1D decay plot (sparsity_fc3_decay_1d.png)
##
## Usage:
##   python -m phonon_inputs pipeline  --config configs/sinw/sinw100_sc4_vasp.yaml
##   python -m phonon_inputs fc3-sow   --config configs/sinw/sinw100_sc4_vasp.yaml
##   python -m phonon_inputs fc3-run   --config configs/sinw/sinw100_sc4_vasp.yaml
##   python -m phonon_inputs fc3-reap  --config configs/sinw/sinw100_sc4_vasp.yaml

