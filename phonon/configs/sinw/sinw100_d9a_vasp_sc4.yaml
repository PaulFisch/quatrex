hiphive:
  # ----------------------------------------------------------------------
  # SiNW(100), d ~ 9 Å (21 Si + 16 H per primitive, 148 atoms in [1,1,4]).
  # The [1,1,4] supercell raises L/2 along z to 10.86 Å, well above the
  # FC2 cutoff of 5 Å — fixes the Z-zone-boundary imaginary modes seen
  # at [1,1,2]. Settings rationale: HIPHIVE_FITTING_NOTES.md.
  # ----------------------------------------------------------------------
  supercell: [1, 1, 4]
  # 16 × 148 × 3 = 7104 equations vs ~3000 FC3 parameters — same overdet.
  # margin as the [1,1,2] × 32 recipe but with 2× more atoms per structure
  # and 2× fewer DFT runs.
  n_structures: 16
  rattle_method: mc
  rattle_std: 0.04
  rattle_d_min: 1.4
  rattle_n_iter: 20
  rattle_seed: 42
  cutoffs: [5.0, 4.0]
  fit_method: ardr
  fit_kwargs: {}
  rotational_sum_rule: post_fit
  convergence:
    sizes: [6, 10, 12, 16]
    pool_size: 16
    test_fraction: 0.2
    seed: 0
    fit_methods: [ardr, rfe]
    dispersion_q_mesh: [1, 1, 16]
  phonon_rattle_temperature_k: 300.0
  phonon_rattle_bootstrap_n: 6
  phonon_rattle_bootstrap_seed: 0
  phonon_rattle_imag_freq_factor: 1.0
  phonon_rattle_qm: true
  calculator: vasp
  work_dir: ./fc3_hiphive_sinw100_d9a_sc4_vasp
  pw_timeout: 7200
thirdorder:
  supercell: [1, 1, 4]
  cutoff_pair_distance: null
  displacement_distance: 0.03
  fc_calculator: symfc
  calculator: vasp
